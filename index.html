<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Evaluasi APIP - Lampung Barat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hidden { display: none !important; }
        /* Animasi Loading kecil */
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <section id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Sistem Evaluasi</h1>
                <p class="text-sm text-gray-500">Pemerintah Kabupaten Lampung Barat</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kabupaten</label>
                    <select id="kabupaten" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                        <option value="Lampung Barat">Lampung Barat</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Perangkat Daerah (OPD)</label>
                    <select id="opd" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50">
                        <option value="">-- Pilih OPD --</option>
                        <option value="Dinas Pendidikan">Dinas Pendidikan</option>
                        <option value="Dinas Kesehatan">Dinas Kesehatan</option>
                        <option value="Dinas Sosial">Dinas Sosial</option>
                        </select>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50" placeholder="Masukkan password">
                </div>

                <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200">
                    Masuk Aplikasi
                </button>
            </form>
        </div>
    </section>

    <section id="main-content" class="hidden min-h-screen pb-10">
        <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
            <div class="container mx-auto px-4 h-16 flex justify-between items-center">
                <div>
                    <h1 class="font-bold text-lg text-blue-900">E-Evaluasi APIP</h1>
                    <p id="user-display" class="text-xs text-gray-500">OPD: -</p>
                </div>
                <button onclick="logout()" class="text-sm text-red-600 font-semibold hover:bg-red-50 px-3 py-1 rounded">
                    Keluar
                </button>
            </div>
        </nav>

        <div class="container mx-auto px-4 mt-8 max-w-4xl">
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                <h2 class="font-semibold text-blue-800">Formulir Isian</h2>
                <p class="text-sm text-blue-600">Silakan lengkapi data berikut sesuai kondisi riil.</p>
            </div>

            <form id="evaluationForm">
                <div id="form-container"></div>

                <div class="mt-8 mb-12 text-right">
                    <button type="button" class="px-8 py-3 bg-green-600 text-white font-bold rounded-lg shadow hover:bg-green-700 transition">
                        Simpan Semua Jawaban
                    </button>
                </div>
            </form>
        </div>
    </section>

    <script>
        // URL Backend Netlify Function
        const API_URL = '/.netlify/functions/api';

        // 1. SAAT WEB DIBUKA, CEK LOGIN
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('user_session'));
            if (session) {
                tampilkanHalamanUtama(session);
            }
        });

        // 2. FUNGSI LOGIN
        async function handleLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnLogin');
            const opd = document.getElementById('opd').value;
            const kab = document.getElementById('kabupaten').value;
            const pass = document.getElementById('password').value;

            // Validasi Input Kosong
            if(!opd || !pass) { alert("Mohon lengkapi data login."); return; }

            // Loading State
            btn.innerHTML = '<div class="spinner"></div> Memproses...';
            btn.disabled = true;

            try {
                // Request ke Backend
                const response = await fetch(`${API_URL}?mode=login&opd=${encodeURIComponent(opd)}&kabupaten=${encodeURIComponent(kab)}&password=${encodeURIComponent(pass)}`);
                const result = await response.json();

                if (response.ok && result.status === 'ok') {
                    // Simpan Sesi & Redirect
                    localStorage.setItem('user_session', JSON.stringify(result.data));
                    tampilkanHalamanUtama(result.data);
                } else {
                    alert(result.message || "Password atau OPD Salah");
                }
            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan koneksi ke server.");
            } finally {
                // Reset Tombol
                btn.innerHTML = 'Masuk Aplikasi';
                btn.disabled = false;
            }
        }

        // 3. FUNGSI LOGOUT
        function logout() {
            if(confirm("Apakah Anda yakin ingin keluar?")) {
                localStorage.removeItem('user_session');
                window.location.reload();
            }
        }

        // 4. TRANSISI KE HALAMAN UTAMA
        function tampilkanHalamanUtama(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-display').innerText = `OPD: ${user.opd}`;

            // Panggil Data Pertanyaan
            loadQuestions(user);
        }

        // 5. AMBIL PERTANYAAN DARI BACKEND
        async function loadQuestions(user) {
            const container = document.getElementById('form-container');
            container.innerHTML = '<div class="text-center py-10 animate-pulse text-blue-600">Sedang mengambil data formulir dari Database...</div>';

            try {
                const response = await fetch(`${API_URL}?mode=get_questions&opd=${encodeURIComponent(user.opd)}&kabupaten=${encodeURIComponent(user.kabupaten)}`);
                const questions = await response.json();

                renderForm(questions);
            } catch (error) {
                container.innerHTML = `<div class="text-center text-red-500 py-10">Gagal memuat pertanyaan: ${error.message}</div>`;
            }
        }

        // 6. RENDER FORMULIR (SESUAI UI ANDA)
        function renderForm(questions) {
            const container = document.getElementById('form-container');
            
            if (!questions || questions.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10 bg-gray-50 rounded border border-gray-200">Tidak ada pertanyaan ditemukan untuk OPD ini.</div>';
                return;
            }

            let html = '';
            questions.forEach((item, index) => {
                const id = item.id_pertanyaan || index; // Fallback jika ID kosong
                
                html += `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 transition hover:shadow-md">
                    ${item.judul ? `<div class="mb-3"><span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded uppercase">${item.judul}</span></div>` : ''}
                    
                    <label class="block text-gray-800 font-semibold text-lg mb-2">
                        <span class="text-gray-400 mr-2">${index + 1}.</span>${item.pertanyaan}
                    </label>
                    ${item.sub ? `<p class="text-sm text-gray-500 mb-4 ml-6 border-l-2 border-gray-200 pl-3">${item.sub}</p>` : ''}

                    <div class="ml-0 md:ml-6 space-y-4">
                        ${item.tipe === 'pilihan' ? renderSelect(id, item.opsi) : renderTextarea(id)}

                        ${item.upload === 'ya' ? `
                        <div class="p-4 bg-blue-50/50 border border-dashed border-blue-200 rounded-lg mt-2">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-medium text-blue-800 flex items-center gap-2">📄 Upload Bukti Dukung</span>
                                <span class="text-xs text-blue-600 bg-white px-2 py-1 rounded border border-blue-100">Max: ${item.limit || 1} file</span>
                            </div>
                            <input type="file" name="file_${id}" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                        </div>` : ''}

                        ${item.alasan === 'ya' ? `
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Catatan / Alasan</label>
                            <textarea name="reason_${id}" rows="2" class="w-full p-2 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 focus:border-blue-500 bg-gray-50" placeholder="Berikan penjelasan tambahan..."></textarea>
                        </div>` : ''}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // Helper Render Dropdown
        function renderSelect(id, optionsStr) {
            const opts = optionsStr ? optionsStr.split('\n') : [];
            return `
            <div class="relative">
                <select name="ans_${id}" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 appearance-none">
                    <option value="">-- Pilih Jawaban --</option>
                    ${opts.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('')}
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>`;
        }

        // Helper Render Textarea
        function renderTextarea(id) {
            return `<textarea name="ans_${id}" rows="3" class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Tulis jawaban Anda di sini..."></textarea>`;
        }
    </script>
</body>
</html>
